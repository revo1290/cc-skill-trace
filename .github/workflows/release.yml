name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.2.0)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Publish to npm & create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      # Fail fast (and with a clear message) if NPM_TOKEN is missing, expired
      # or lacks publish rights, instead of discovering it after the version
      # bump/tag/GitHub Release have already been created. `npm publish` with
      # a bad token reports a generic "404 Not Found" that's indistinguishable
      # from "package doesn't exist" — this surfaced twice (v2.0.0, v3.0.0)
      # and left the repo in an inconsistent state (tag + Release with no
      # matching npm version) before the ordering fix below.
      - name: Verify npm authentication before doing anything else
        run: |
          if ! npm whoami; then
            echo "::error::npm authentication failed — NPM_TOKEN is missing, expired, or not an 'Automation' type token (regular tokens can be blocked by the account's 2FA-for-publish setting even though the value is otherwise valid). Generate a new Automation token at https://www.npmjs.com/settings/~/tokens and update the NPM_TOKEN repository secret."
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Requires repo secret: SSH_SIGNING_KEY (private key of id_ed25519_signing).
      # The corresponding public key must be registered under
      # GitHub Settings → SSH and GPG keys → Signing keys.
      - name: Set up SSH signing key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_SIGNING_KEY }}" > ~/.ssh/signing_key
          chmod 600 ~/.ssh/signing_key
          git config gpg.format ssh
          git config user.signingkey ~/.ssh/signing_key
          git config tag.gpgsign true

      - name: Bump version in package.json
        run: npm version "${{ inputs.version }}" --no-git-tag-version

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      # Publish to npm BEFORE any git state changes (version-bump PR, tag,
      # GitHub Release). If this fails, nothing else in this workflow has
      # touched the repo yet, so the run can simply be re-triggered once the
      # underlying issue (e.g. NPM_TOKEN) is fixed — no manual cleanup of a
      # dangling tag/Release that points at a version npm never received.
      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Push version bump as release branch, open PR, and enable auto-merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "release/v${{ inputs.version }}"
          git add package.json package-lock.json
          git commit -m "chore: release v${{ inputs.version }}"
          git push origin "release/v${{ inputs.version }}"
          gh pr create \
            --title "chore: release v${{ inputs.version }}" \
            --body "Automated version bump. Auto-merges after CI passes." \
            --base main \
            --head "release/v${{ inputs.version }}"
          gh pr merge --auto --merge "release/v${{ inputs.version }}"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create SSH-signed release tag
        run: |
          git tag -s -a "v${{ inputs.version }}" \
            -m "Release v${{ inputs.version }}" \
            "$(git rev-parse HEAD)"
          git push origin "v${{ inputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: v${{ inputs.version }}
          generate_release_notes: true
          make_latest: true
